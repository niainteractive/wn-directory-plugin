<table class="table table-striped align-middle">
    <thead>
        <tr>
            <th>What you use</th>
            <th class="text-center">Alternatives</th>
            <th>Try first</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in entries %}
            <tr>
                <td><a href="/products/{{ entry.slug }}">{{ entry.name }}</a></td>
                <td class="text-center">{{ entry.alt_count }}</td>
                <td>{% if entry.top_alternative %}{{ entry.top_alternative }}{% else %}&mdash;{% endif %}</td>
            </tr>
        {% else %}
            <tr>
                <td colspan="3">Nothing listed yet.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
