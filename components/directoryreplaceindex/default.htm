<nav class="directory-replace__alphabet">
    {% for a in alphabet %}
        <a href="/replace/{{ a }}"{% if a == letter %} class="is-active"{% endif %}>{{ a }}</a>
    {% endfor %}
</nav>

<ul class="directory-replace">
    {% for entry in entries %}
        <li class="directory-replace__item">
            <a href="/products/{{ entry.slug }}">{{ entry.name }}</a>
        </li>
    {% else %}
        <li class="directory-replace__empty">Nothing listed under this letter yet.</li>
    {% endfor %}
</ul>
